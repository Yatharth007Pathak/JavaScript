<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Interactive Solar System</title>
  <link rel="stylesheet" href="SolarSystem.css" />
</head>
<body>
  <canvas id="space" aria-label="Solar System Simulation"></canvas>

  <aside class="panel">
    <section>
      <h2>Controls</h2>
      <div class="controls">
        <button id="playPause" aria-pressed="false">Pause</button>
        <button id="reset">Reset View</button>
      </div>
      <div class="sliders">
        <label for="speed">Speed</label>
        <input type="range" id="speed" min="0.1" max="10" step="0.1" value="1" />
        <br />
        <label for="scale">Scale</label>
        <input type="range" id="scale" min="0.2" max="2" step="0.1" value="0.5" />
        <br />
        <label for="show-orbits">
          <input type="checkbox" id="show-orbits" checked /> Show Orbits
        </label>
      </div>
    </section>

    <section>
      <h2>Planets</h2>
      <ul id="legendList" aria-live="polite"></ul>
    </section>

    <section>
      <h2>Planet Info</h2>
      <div id="planetInfo">Click on a planet to see details.</div>
    </section>
  </aside>

  <template id="legend-tpl">
    <li class="planet-item">
      <span class="dot" aria-hidden="true"></span>
      <span class="name"></span>
    </li>
  </template>

  <script src="SolarSystem.js"></script>
</body>
</html>
