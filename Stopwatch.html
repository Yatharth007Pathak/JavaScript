<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Stopwatch</title>
    <link rel="stylesheet" href="Stopwatch.css">
</head>
<body>

    <div class="container">

        <h1>Stopwatch</h1>

        <div id="time" aria-label="Stopwatch Time">
            <span class="digit" id="hr" aria-label="Hours">00</span>
            <span class="txt">Hr</span>
            <span class="digit" id="min" aria-label="Minutes">00</span>
            <span class="txt">Min</span>
            <span class="digit" id="sec" aria-label="Seconds">00</span>
            <span class="txt">Sec</span>
            <span class="digit" id="count" aria-label="Milliseconds">00</span>
        </div>

        <div id="buttons">
            <button class="btn" id="start" aria-label="Start Stopwatch">Start</button>
            <button class="btn" id="stop" aria-label="Stop Stopwatch">Stop</button>
            <button class="btn" id="reset" aria-label="Reset Stopwatch">Reset</button>
        </div>

    </div>

    <script src="Stopwatch.js"></script>

</body>
</html>
